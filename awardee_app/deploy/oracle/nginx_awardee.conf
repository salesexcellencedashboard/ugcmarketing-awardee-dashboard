#===============================================================================
# AWARDEE System - Nginx Configuration for Oracle Cloud
#===============================================================================
# Place this file at: /etc/nginx/sites-available/awardee
# Then run:
#   sudo ln -s /etc/nginx/sites-available/awardee /etc/nginx/sites-enabled/
#   sudo rm /etc/nginx/sites-enabled/default
#   sudo nginx -t
#   sudo systemctl restart nginx
#===============================================================================

server {
    listen 80;
    server_name YOUR_SERVER_PUBLIC_IP;

    # Redirect all HTTP traffic to HTTPS (uncomment when SSL is ready)
    # return 301 https://$host$request_uri;

    root /var/www/awardee/public;
    index index.php index.html;

    charset utf-8;

    client_max_body_size 20M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Main application routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM processing
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Deny access to hidden files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Static assets caching
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Uploaded files
    location ^~ /uploads/ {
        alias /var/www/awardee/public/uploads/;
        try_files $uri =404;
    }
}